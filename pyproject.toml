[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python"]
manifest-path = "engine/Cargo.toml"
module-name = "atlas_cortex._engine"
python-source = "python"

[project]
name = "atlas_cortex"
version = "2.1.0"
description = "AST-based Semantic Parser and RAG Context Optimizer built in Rust"
readme = "README.md"
authors = [
    { name = "Atlas Cortex Team" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.1.0",
    "cffi>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.0",
    "numpy>=1.20",
]
converters = [
    "markdownify>=0.11",
    "mammoth>=1.6",
]
neo4j = [
    "neo4j>=5.0",
]
qdrant = [
    "qdrant-client>=1.7",
]
llamaindex = [
    "llama-index-core>=0.10",
]
all = [
    "atlas_cortex[converters,neo4j,qdrant,llamaindex]",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["atlas_cortex*"]

[tool.pytest.ini_options]
markers = [
    "stress: marca testes de estresse pesados (rodar apenas com -m stress)"
]
