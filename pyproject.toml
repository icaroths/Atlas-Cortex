[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas_cortex"
version = "0.1.0"
description = "AST-based Semantic Parser and RAG Context Optimizer built in Rust"
readme = "README.md"
authors = [
    { name = "Atlas Cortex Team" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.0",
    "numpy>=1.20",
]

[tool.setuptools.packages.find]
where = ["python"]
include = ["atlas_cortex*"]

[tool.pytest.ini_options]
markers = [
    "stress: marca testes de estresse pesados (rodar apenas com -m stress)"
]
