name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-audit-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Check formatting
      working-directory: engine
      run: cargo fmt --check

    - name: Clippy checks
      working-directory: engine
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Tests
      working-directory: engine
      run: cargo test --release

    - name: Cargo Audit
      working-directory: engine
      run: cargo audit

  python-audit-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python/requirements.txt
        pip install pytest ruff mypy pip-audit bandit langchain_core sentence-transformers

    - name: Pip Audit
      run: pip-audit

    - name: Bandit Security Scan
      run: |
        bandit -r python -ll
        bandit -r scripts -ll

    - name: Ruff Check
      run: ruff check python scripts

    - name: Mypy Check
      run: mypy python

    - name: Pytest
      env:
        PYTHONPATH: python
      run: pytest python/tests
