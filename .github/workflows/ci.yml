name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  rust-audit-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Check formatting
      working-directory: engine
      run: cargo fmt --check

    - name: Clippy checks
      working-directory: engine
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run Tests
      working-directory: engine
      run: cargo test --release

    - name: Cargo Audit
      working-directory: engine
      run: cargo audit

  python-audit-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up Rust for Engine Build
      uses: dtolnay/rust-toolchain@stable

    - name: Build Engine
      working-directory: engine
      run: cargo build --release

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest ruff mypy pip-audit bandit langchain_core

    - name: Pip Audit
      run: pip-audit

    - name: Bandit Security Scan
      run: |
        bandit -r python -ll
        bandit -r scripts -ll

    - name: Ruff Check
      run: ruff check python scripts

    - name: Mypy Check
      run: mypy python

    - name: Pytest
      env:
        PYTHONPATH: python
      run: pytest python/tests

    - name: Run Repository Audit Script (Audit & Anti-Drift)
      env:
        PYTHONPATH: python
      run: python audit.py

    - name: Run Functional Probe Audit
      env:
        PYTHONPATH: python
      run: python audit_test_final.py

    - name: Generate MOCs (Anti-drift Check)
      env:
        PYTHONPATH: python
      run: |
        python scripts/generate_mocs.py
        git diff --exit-code docs/ || (echo "Error: MOC files in docs/ are outdated! Please run scripts/generate_mocs.py and commit the updated .moc.json files." && exit 1)
