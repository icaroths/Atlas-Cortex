name: Auto Create and Merge PR

on:
  push:
    branches:
      - 'update-*'
      - 'auto-*'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-pr-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create and Auto-Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determina a branch base (main ou evaluation dependendo do nome da branch atual)
          TARGET_BRANCH="main"
          if [[ "${GITHUB_REF_NAME}" == *"eval"* ]]; then
            TARGET_BRANCH="evaluation"
          fi
          
          echo "Current branch: ${GITHUB_REF_NAME}"
          echo "Target base branch: ${TARGET_BRANCH}"

          # Verifica se ja existe um PR aberto para esta branch
          PR_EXISTS=$(gh pr list --head "${GITHUB_REF_NAME}" --base "${TARGET_BRANCH}" --state open --json number -q '.[0].number')
          
          if [ -z "$PR_EXISTS" ] || [ "$PR_EXISTS" == "null" ]; then
            echo "Criando novo Pull Request..."
            gh pr create --title "Automated Update: ${GITHUB_REF_NAME}" \
                         --body "Este PR foi criado automaticamente. O auto-merge está ativado." \
                         --head "${GITHUB_REF_NAME}" \
                         --base "${TARGET_BRANCH}"
          else
            echo "Pull Request #${PR_EXISTS} ja existe."
          fi
          
          echo "Ativando o auto-merge no PR..."
          gh pr merge "${GITHUB_REF_NAME}" --auto --merge
